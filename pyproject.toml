[project]
name = "novaaltairbot"
version = "0.1.0"
description = "NovaAltairBot - telgram-bot for buy 3xui configs"
readme = "README.md"
authors = [
    { name = "rimuru3573", email = "volokitin11@internet.ru" }
]
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.31.0",
    "aiohttp>=3.14.5",
    "aiohttp-socks>=0.12.0",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
